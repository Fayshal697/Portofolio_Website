<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fayshal Karan Athilla Portfolio</title>
    <meta name="description" content="A creative portfolio website for Game Developer and Graphic Designer Fayshal Karan Athilla, featuring interactive skill visualization and project timelines." />
    <meta property="og:title" content="Fayshal Karan Athilla Portfolio" />
    <meta property="og:description" content="A creative portfolio website for Game Developer and Graphic Designer Fayshal Karan Athilla, featuring interactive skill visualization and project timelines." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: {
                primary: '#00f0ff',
                secondary: '#7000df',
                bg: '#050505',
                card: '#101010',
                text: '#e0e0e0',
                accent: '#ff003c'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-padding-top: 100px;
      }
      body {
        background-color: #050505;
        color: #e0e0e0;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #101010;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f0ff;
      }
      .glitch-text {
        position: relative;
      }
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -1px 0 #ff003c;
        clip: rect(24px, 550px, 90px, 0);
        animation: glitch-anim-2 3s infinite linear alternate-reverse;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -1px 0 #00f0ff;
        clip: rect(85px, 550px, 140px, 0);
        animation: glitch-anim 2.5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(10px, 9999px, 30px, 0); }
        20% { clip: rect(80px, 9999px, 100px, 0); }
        40% { clip: rect(5px, 9999px, 50px, 0); }
        60% { clip: rect(60px, 9999px, 90px, 0); }
        80% { clip: rect(30px, 9999px, 70px, 0); }
        100% { clip: rect(20px, 9999px, 60px, 0); }
      }
      @keyframes glitch-anim-2 {
        0% { clip: rect(60px, 9999px, 90px, 0); }
        20% { clip: rect(10px, 9999px, 40px, 0); }
        40% { clip: rect(40px, 9999px, 80px, 0); }
        60% { clip: rect(10px, 9999px, 50px, 0); }
        80% { clip: rect(70px, 9999px, 100px, 0); }
        100% { clip: rect(30px, 9999px, 60px, 0); }
      }

      /* Subtle Glitch Card Hover Animations */
      .glitch-card {
        position: relative;
        transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .glitch-card:hover {
        animation: card-glitch-subtle 0.55s ease-in-out;
        border-color: rgba(0, 240, 255, 0.75);
        box-shadow: 0 0 35px rgba(0, 240, 255, 0.22), -1.5px 0 0 rgba(255, 0, 60, 0.35), 1.5px 0 0 rgba(0, 240, 255, 0.45);
      }
      @keyframes card-glitch-subtle {
        0% {
          transform: translate(0, 0);
        }
        12% {
          transform: translate(-1.5px, 0.5px);
        }
        24% {
          transform: translate(1px, -0.5px);
        }
        36% {
          transform: translate(-0.5px, 0);
        }
        50% {
          transform: translate(0.5px, 0);
        }
        65% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      /* Subtle Image Glitch Hologram / RGB slice on hover */
      .glitch-card-slice {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 25;
        mix-blend-mode: screen;
        background: transparent;
      }
      .glitch-card:hover .glitch-card-slice {
        animation: glitch-slice-subtle 0.75s ease-out;
      }
      @keyframes glitch-slice-subtle {
        0% {
          opacity: 0;
          clip-path: inset(0 0 0 0);
          transform: translateX(0);
        }
        15% {
          opacity: 0.6;
          background: rgba(255, 0, 60, 0.18);
          clip-path: inset(18% 0 68% 0);
          transform: translateX(-3px);
        }
        30% {
          opacity: 0.7;
          background: rgba(0, 240, 255, 0.22);
          clip-path: inset(55% 0 28% 0);
          transform: translateX(3px);
        }
        45% {
          opacity: 0.35;
          background: rgba(255, 0, 60, 0.12);
          clip-path: inset(35% 0 52% 0);
          transform: translateX(-1.5px);
        }
        60% {
          opacity: 0;
          clip-path: inset(0 0 0 0);
          transform: translateX(0);
        }
        100% {
          opacity: 0;
        }
      }

      /* Subtle scanline flash on hover */
      .glitch-card-scanline {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.8), transparent);
        opacity: 0;
        pointer-events: none;
        z-index: 26;
      }
      .glitch-card:hover .glitch-card-scanline {
        animation: glitch-scan-pass 0.75s ease-in-out;
      }
      @keyframes glitch-scan-pass {
        0% {
          top: -10%;
          opacity: 0;
        }
        20% {
          opacity: 0.9;
        }
        80% {
          opacity: 0.9;
        }
        100% {
          top: 110%;
          opacity: 0;
        }
      }

      /* Title subtle RGB shadow twitch on card hover */
      .glitch-card:hover .project-title-glitch {
        text-shadow: -1px 0 rgba(255, 0, 60, 0.6), 1px 0 rgba(0, 240, 255, 0.7);
      }

      @media (prefers-reduced-motion: reduce) {
        .glitch-card:hover,
        .glitch-card:hover .glitch-card-slice,
        .glitch-card:hover .glitch-card-scanline {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
